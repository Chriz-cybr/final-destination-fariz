<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
    // fungsi yang menerima callback
    function prosesData(callback) {
        setTimeout(function () {
            // simulasi operasi yang membutuhkan waktu, misalnya menggambil data dari server 
            console.log("Data diproses");
            // setelah selesai, kita memanggil callback
            callback();
        }, 200); // 2 detik penundaan untuk mensimulasikan operasi asinkron
    }

    // fungsi callback
    function setelahSelesai() {
        console.log("OPerasi selesai, callback di panggil");
    }


    // memanggil fungsi peroses data dan melewatkan callback sebagai argumen
    prosesData(setelahSelesai);



</script>

<body>
    <h1>conth callback di javascrip</h1>
    <p>Buka konsol browser (F12) untuk melihat dari callback </p>
</body>

</html>
