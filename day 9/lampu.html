<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontrol Lampu</title>
</head>

<body>
    <h2>kontrol lampu menggunakan java secrip</h2>

    <p>tekan timbol di bawah untuk menghidupkan atau mematikan lampu.</p>

    <button onclick="document.getElementById('myImage').src='../img/LampuON.jpg'">
        nyalakan lampu
    </button>

    <img id="myImage" src="../img/LampuOFF.jpg" style="width: 100px;">

    <button onclick="document.getElementById('myImage').src='../img/LampuOFF.jpg'">
        matikan lampu
    </button>




</body>

</html>
