<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodata Siswa</title>
</head>

<body>
    <h1>Biodata siswa</h1>

    <h2></h2>

    <div class="identitas">Nama </div>
    <div class="identitas">Kelas </div>
    <div class="identitas">Jurusan </div>

    <br> <br>

    <h2>masukkan nama siswa</h2>

    <input type="text" id="Nama" placeholder="masukkan nama">


    <br><br>

    <button onclick="tampilkanBiodata()">Tampilkan biodata</button>

    <h2>hasil</h2>
    <p id="hasil"></p>

    <script>


        function tampilkanBiodata() {

            let nama = document.getElementById("Nama").value;

            let identitas = document.getElementsByClassName("identitas")

            if (Nama === "") {
                alert("nama harus di isi!");
                return false;
            } else {
                alert("selamat datang, " + Nama);


                let kelas = identitas[1].textContent;
                let jurusan = identitas[2].textContent;

                document.getElementById("hasil").innerHTML =
                    "Nama: " + nama + "<br>" + kelas + "<br>" + jurusan;




                return true;
            }
        }


    </script>
</body>

</html>
