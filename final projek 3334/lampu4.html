<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        background-color: #fbbf24;
        background: #4338ca;
    }

    .imgf {
        padding: 0;
        margin: auto;
        z-index: -1;
        width: 100%;
        height: 100%;
    }

    .container {
        width: 100%;
        max-width: 700px;
        padding: 24px;
        text-align: center;
    }

    .container h2 {
        margin-bottom: 24px;
        font-size: 2rem;
        color: #fbbf24;
    }

    .lampu-wrap {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }

    .lampu-box {
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 14px;
        padding: 18px 12px;
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .lampu-box:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
    }

    .lampu-box img {
        display: block;
        width: 120px;
        height: 120px;
        object-fit: contain;
        margin: 0 auto 12px;
    }

    .lampu-box p {
        margin: 6px 0;
        font-size: 0.95rem;
    }

    .lampu-box p[id^="status"] {
        font-weight: bold;
    }

    .lampu-box p[id^="timer"] {
        min-height: 1.4em;
        color: #9ca3af;
        font-size: 0.85rem;
    }

    .lampu-box button {
        margin-top: 10px;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        font-size: 0.9rem;
        cursor: pointer;
        transition: background 0.3s;
    }

    .lampu-box button:hover {
        background: #4338ca;
    }

    .lampu-box button:active {
        transform: scale(0.96);
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        color: white;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        background-image: url("../img/Cats\ r\ way\ more\ luckier\ than\ meh!!.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-image:
            linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
            url("../img/Cats\ r\ way\ more\ luckier\ than\ meh!!.jpg");
    }
</style>

<body>

    <div class="container">
        <h2>Kontrol 4 Lampu</h2>
        <a href="layout.html">Kembali Beranda</a>
        <div class="lampu-wrap">

            <div class="lampu-box">
                <img id="gambar1" src="../img/LampuOFF.jpg" alt="Lampu 1">
                <p id="status1">Status: Mati</p>
                <p id="timer1"></p>
                <button id="tombol1" onclick="toggleLampu(1)">Nyalakan Lampu 1</button>
                <img class="imgf" src="../img/Cats r way more luckier than meh!!.jpg">
            </div>

            <div class="lampu-box">
                <img id="gambar2" src="../img/LampuOFF.jpg" alt="Lampu 2">
                <p id="status2">Status: Mati</p>
                <p id="timer2"></p>
                <button id="tombol2" onclick="toggleLampu(2)">Nyalakan Lampu 2</button>
                <img class="imgf" src="../img/Cats r way more luckier than meh!!.jpg">
            </div>

            <div class="lampu-box">
                <img id="gambar3" src="../img/LampuOFF.jpg" alt="Lampu 3">
                <p id="status3">Status: Mati</p>
                <p id="timer3"></p>
                <button id="tombol3" onclick="toggleLampu(3)">Nyalakan Lampu 3</button>
                <img class="imgf" src="../img/Cats r way more luckier than meh!!.jpg">
            </div>

            <div class="lampu-box">
                <img id="gambar4" src="../img/LampuOFF.jpg" alt="Lampu 4">
                <p id="status4">Status: Mati</p>
                <p id="timer4"></p>
                <button id="tombol4" onclick="toggleLampu(4)">Nyalakan Lampu 4</button>
                <img class="imgf" src="../img/Cats r way more luckier than meh!!.jpg">
            </div>

        </div>
    </div>


    <script>
        const DURASI = 5;               // lama lampu menyala (detik)
        let nyala = [false, false, false, false, false];   // status tiap lampu (indeks 1-4)
        let timers = {};                // menyimpan timer tiap lampu

        function toggleLampu(n) {
            if (nyala[n]) {
                matikanLampu(n);
            } else {
                hidupkanLampu(n);
            }
        }

        function hidupkanLampu(n) {
            let gambar = document.getElementById("gambar" + n);
            let status = document.getElementById("status" + n);
            let timerText = document.getElementById("timer" + n);
            let tombol = document.getElementById("tombol" + n);

            gambar.src = "../img/lampuON.jpg";
            status.innerHTML = "Status: Menyala";
            tombol.innerHTML = "Matikan Lampu " + n;
            nyala[n] = true;

            let sisa = DURASI;
            timerText.innerHTML = "Mati otomatis dalam " + sisa + " detik";

            timers[n] = setInterval(function () {
                sisa--;
                if (sisa > 0) {
                    timerText.innerHTML = "Mati otomatis dalam " + sisa + " detik";
                } else {
                    matikanLampu(n);
                }
            }, 1000);
        }

        function matikanLampu(n) {
            clearInterval(timers[n]);

            document.getElementById("gambar" + n).src = "../img/LampuOFF.jpg";
            document.getElementById("status" + n).innerHTML = "Status: Mati";
            document.getElementById("timer" + n).innerHTML = "";
            document.getElementById("tombol" + n).innerHTML = "Nyalakan Lampu " + n;
            nyala[n] = false;
        }
    </script>




</body>


</html>
